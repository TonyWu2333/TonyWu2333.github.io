<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Tony Wu</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f6f3ee; --ink: #1a1714; --muted: #6b645c; --line: #e4ddd2; --accent: #c2410c; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12110f; --ink: #ede8e1; --muted: #9a9188; --line: #2c2925; --accent: #f0783c; color-scheme: dark; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--ink); font: 16px/1.65 Inter, system-ui, sans-serif;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: clamp(64px, 14vw, 140px); line-height: .92; margin: 20px 0 24px; }
  h1 em { color: var(--accent); }
  a { display: inline-block; margin-top: 32px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); color: inherit; text-decoration: none; font-weight: 500; }
  a:hover { border-color: var(--ink); }
</style>
</head>
<body>
<main>
  <div class="mono">404 · Page not found</div>
  <h1>Lost <em>here.</em></h1>
  <p>This page doesn't exist. 这个页面不存在。</p>
  <a href="/">← Tony Wu</a>
</main>
</body>
</html>
